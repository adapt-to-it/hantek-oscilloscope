[workspace]
resolver = "3"
members = ["crates/h6022-usb", "crates/h6022-dsp", "crates/h6022-core", "crates/h6022-cli", "crates/h6022-gui", "crates/h6022-record", "crates/h6022-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
nusb = "0.2.8"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
rustfft = "6.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }

[profile.release]
lto = "thin"
codegen-units = 1
