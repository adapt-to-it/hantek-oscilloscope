[workspace]
resolver = "3"
members = ["crates/h6022-usb", "crates/h6022-dsp", "crates/h6022-core", "crates/h6022-cli", "crates/h6022-record", "crates/h6022-server", "crates/h6022-decode", "crates/h6022-view", "crates/h6022-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
nusb = "0.2.8"
ctrlc = { version = "3.4", features = ["termination"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
rustfft = "6.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
