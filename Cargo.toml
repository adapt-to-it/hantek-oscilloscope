[workspace]
resolver = "3"
members = ["crates/h6022-usb", "crates/h6022-dsp", "crates/h6022-core", "crates/h6022-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nusb = "0.2.8"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
rustfft = "6.4"

[profile.release]
lto = "thin"
codegen-units = 1
