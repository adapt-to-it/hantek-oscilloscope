[package]
name = "h6022-gui"
description = "Interfaccia grafica dell'oscilloscopio Hantek 6022BE"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "h6022-gui"
path = "src/main.rs"

[dependencies]
ctrlc.workspace = true
h6022-usb = { path = "../h6022-usb" }
h6022-core = { path = "../h6022-core" }
h6022-dsp = { path = "../h6022-dsp" }
h6022-decode = { path = "../h6022-decode" }
h6022-server = { path = "../h6022-server" }
eframe.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
