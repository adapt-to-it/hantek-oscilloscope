# Release automatica: un tag v* costruisce gli installer per macOS, Windows e Linux
# e li pubblica in una GitHub Release. Il tag si crea con scripts/release.sh.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verifica versione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Il tag corrisponde a tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version crates/h6022-app/tauri.conf.json)
          if [ "$tag" != "$conf" ]; then
            echo "::error::Il tag v$tag non corrisponde alla versione $conf di tauri.conf.json. Usa scripts/release.sh."
            exit 1
          fi

  build:
    name: build (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            cli-target: universal-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ""
            cli-target: x86_64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: ""
            cli-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Dipendenze dell'interfaccia
        working-directory: ui
        run: npm ci

      # Senza i secret Apple l'app riceve una firma ad hoc e non viene notarizzata.
      # Con i secret configurati la firma Developer ID e la notarizzazione sono automatiche.
      - name: Firma macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Installer dell'app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_name }}
          releaseName: Hantek Oscilloscope ${{ github.ref_name }}
          releaseBody: See the assets below for the installers of each platform.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: CLI (macOS universale)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p h6022-cli --target aarch64-apple-darwin
          cargo build --release -p h6022-cli --target x86_64-apple-darwin
          mkdir -p dist-cli
          lipo -create -output dist-cli/h6022 \
            target/aarch64-apple-darwin/release/h6022 \
            target/x86_64-apple-darwin/release/h6022

      - name: CLI (Windows e Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p h6022-cli --target ${{ matrix.cli-target }}
          mkdir -p dist-cli
          cp target/${{ matrix.cli-target }}/release/h6022${{ runner.os == 'Windows' && '.exe' || '' }} dist-cli/

      - name: Pubblica la CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="h6022-cli-${GITHUB_REF_NAME}-${{ matrix.cli-target }}"
          cp LICENSE-MIT LICENSE-APACHE README.md dist-cli/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$archive.zip" ./dist-cli/*
            gh release upload "$GITHUB_REF_NAME" "$archive.zip" --clobber
          else
            tar -czf "$archive.tar.gz" -C dist-cli .
            gh release upload "$GITHUB_REF_NAME" "$archive.tar.gz" --clobber
          fi
